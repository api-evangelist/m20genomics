name: M20 Genomics
description: M20 Genomics is a life-science technology company advancing single-cell and spatial
  transcriptomics. Its VITA platform delivers single-cell full-length transcriptome sequencing across
  sample types and species, supported by the VITAcruizer single-cell partitioning system, VITApilote
  library-preparation kits, and VITAseer bioinformatics software. The company's M20 Seq and M20 Spatial
  technologies serve basic research (cancer, neurobiology, immunology, developmental biology), clinical
  research (oncology, reproductive medicine, infectious diseases), and drug development and target
  screening, including prokaryotic and eukaryotic single-cell RNA sequencing. Surfaced as a portfolio
  company of Qiming and profiled in the API Evangelist network; it publishes lab instruments, reagent
  kits, and analysis software rather than a public web API or developer platform.
